<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="Sinraj S - Aspiring SOC Analyst · Linux, networking and Windows security · building hands-on labs">
  <title>Sinraj S</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#0a1f4d"/>
      <stop offset="0.5" stop-color="#2a1a6e"/>
      <stop offset="1" stop-color="#5b1a8c"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9ec5ff"/>
      <stop offset="0.45" stop-color="#5b8cff"/>
      <stop offset="1" stop-color="#c77dff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.55" r="0.6">
      <stop offset="0" stop-color="#d946ef" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#d946ef" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.45"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="1.6"/></filter>
    <filter id="softer"><feGaussianBlur stdDeviation="0.7"/></filter>
    <clipPath id="banner"><rect x="0" y="0" width="1200" height="280" rx="26"/></clipPath>
    <clipPath id="face"><circle cx="175" cy="280" r="100"/></clipPath>
  </defs>

  <rect width="1200" height="440" rx="26" fill="#0b1517"/>

  <g clip-path="url(#banner)">
    <rect width="1200" height="280" fill="url(#bg)"/>
    <rect width="1200" height="280" fill="url(#glow)"/>
    <g font-family="Cascadia Code, Consolas, DejaVu Sans Mono, monospace" fill="url(#ink)" transform="skewX(-8)">
      <text x="125" y="26" font-size="15" filter="none" opacity="0.93">sudo ufw default deny incoming<tspan dx="40">nmap -sV -p- 192.168.56.10   # lab VM only</tspan></text>
      <text x="162" y="50" font-size="18" filter="url(#softer)" opacity="0.81">sudo sshd -T | grep -Ei &#x27;permitrootlogin|passwordauth&#x27;<tspan dx="40">PermitRootLogin no  ·  PasswordAuthentication no</tspan></text>
      <text x="-3" y="77" font-size="21" filter="url(#soft)" opacity="0.88">grep &#x27;Failed password&#x27; /var/log/auth.log | sort | uniq -c<tspan dx="40">tshark -r capture.pcap -Y &#x27;dns.qry.name&#x27;</tspan></text>
      <text x="8" y="107" font-size="15" filter="none" opacity="0.70">Get-WinEvent -FilterHashtable @{LogName=&#x27;Security&#x27;;Id=4625}<tspan dx="40">sudo find / -xdev -perm -4000 -type f</tspan></text>
      <text x="-11" y="131" font-size="18" filter="none" opacity="0.91">sudo ufw limit from 192.168.56.0/24 to any port 22 proto tcp<tspan dx="40">[ALERT] Possible brute force: 8 failures from 203.0.113.45</tspan></text>
      <text x="69" y="158" font-size="21" filter="url(#soft)" opacity="0.56">nmap -sV -p- 192.168.56.10   # lab VM only<tspan dx="40">chmod 2770 /srv/devteam  &amp;&amp;  chage -E 2026-12-31 contractor</tspan></text>
      <text x="182" y="188" font-size="15" filter="none" opacity="0.72">PermitRootLogin no  ·  PasswordAuthentication no<tspan dx="40">Event 4740: user account was locked out</tspan></text>
      <text x="83" y="212" font-size="18" filter="none" opacity="0.59">tshark -r capture.pcap -Y &#x27;dns.qry.name&#x27;<tspan dx="40">sudo ufw default deny incoming</tspan></text>
      <text x="177" y="239" font-size="21" filter="url(#soft)" opacity="0.57">sudo find / -xdev -perm -4000 -type f<tspan dx="40">sudo sshd -T | grep -Ei &#x27;permitrootlogin|passwordauth&#x27;</tspan></text>
      <text x="23" y="269" font-size="15" filter="url(#softer)" opacity="0.93">[ALERT] Possible brute force: 8 failures from 203.0.113.45<tspan dx="40">grep &#x27;Failed password&#x27; /var/log/auth.log | sort | uniq -c</tspan></text>
      <text x="-9" y="293" font-size="18" filter="none" opacity="0.78">chmod 2770 /srv/devteam  &amp;&amp;  chage -E 2026-12-31 contractor<tspan dx="40">Get-WinEvent -FilterHashtable @{LogName=&#x27;Security&#x27;;Id=4625}</tspan></text>
    </g>
    <rect width="1200" height="280" fill="url(#fade)"/>
  </g>

  <circle cx="175" cy="280" r="109" fill="#0b1517"/>
  <circle cx="175" cy="280" r="104" fill="none" stroke="#1f4a4f" stroke-width="2"/>
  <image href="data:image/jpeg;base64," x="75" y="180" width="200" height="200" clip-path="url(#face)" preserveAspectRatio="xMidYMid slice"/>

  <text x="315" y="330" font-family="Segoe UI, Ubuntu, Helvetica Neue, Arial, sans-serif" font-size="34" font-weight="700" fill="#e6f1f2">Sinraj S</text>

  <g transform="translate(315, 352)">
    <rect width="40" height="40" rx="10" fill="#0f2226" stroke="#1f4a4f"/>
    <circle cx="20" cy="20" r="9" fill="none" stroke="#8fb3b5" stroke-width="1.8"/>
    <rect x="19" y="18" width="2" height="7" rx="1" fill="#8fb3b5"/>
    <circle cx="20" cy="14.5" r="1.3" fill="#8fb3b5"/>
    <text x="56" y="26" font-family="Segoe UI, Ubuntu, Helvetica Neue, Arial, sans-serif" font-size="18" fill="#8fb3b5">Aspiring SOC Analyst · Linux, networking and Windows security · building hands-on labs</text>
  </g>
</svg>
